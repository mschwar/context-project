[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ctx-tool"
dynamic = ["version"]
description = "Deterministic zero-LLM static AST, import-graph, and blast-radius structural analyzer for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["ai", "agent", "context", "codebase", "mcp", "ast", "dependency-graph", "static-analysis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "pathspec>=0.12",
]

[project.urls]
Homepage = "https://github.com/mschwar/context-project"
Repository = "https://github.com/mschwar/context-project"

[project.optional-dependencies]
serve = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]
all = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "httpx>=0.27",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.scripts]
ctx = "ctx.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ctx = [".ctxignore.default"]

[tool.setuptools.dynamic]
version = {attr = "ctx.__version__"}

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
