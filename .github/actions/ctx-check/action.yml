name: 'CTX Check'
description: 'Validates deterministic .ctx/ structural maps in a ctx project.'
inputs:
  path:
    description: 'Path to the ctx project root.'
    required: false
    default: '.'
  checkout:
    description: "Whether to run actions/checkout ('auto', 'true', or 'false'). 'auto' checks out only when no repository or project files exist at path."
    required: false
    default: 'auto'
  github_token:
    description: 'GitHub Token for checking out the repository.'
    required: false
    default: ${{ github.token }}
  version:
    description: 'Optional ctx-tool PyPI version constraint (e.g. ==1.1.0).'
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    - name: Detect existing workspace checkout
      id: detect_checkout
      shell: bash
      env:
        CTX_TARGET_PATH: ${{ inputs.path }}
        CTX_CHECKOUT_MODE: ${{ inputs.checkout }}
      run: |
        case "${CTX_CHECKOUT_MODE}" in
          true|TRUE|1|yes)
            echo "should_checkout=true" >> "${GITHUB_OUTPUT}"
            ;;
          false|FALSE|0|no)
            echo "should_checkout=false" >> "${GITHUB_OUTPUT}"
            ;;
          auto|"")
            if [ -e "${CTX_TARGET_PATH}/.git" ] || [ -n "$(ls -A "${CTX_TARGET_PATH}" 2>/dev/null)" ]; then
              echo "should_checkout=false" >> "${GITHUB_OUTPUT}"
            else
              echo "should_checkout=true" >> "${GITHUB_OUTPUT}"
            fi
            ;;
          *)
            echo "::error::Invalid checkout input '${CTX_CHECKOUT_MODE}'. Expected 'auto', 'true', or 'false'."
            exit 1
            ;;
        esac

    - name: Checkout repository
      if: ${{ steps.detect_checkout.outputs.should_checkout == 'true' }}
      uses: actions/checkout@v4
      with:
        token: ${{ inputs.github_token }}
        path: '${{ inputs.path }}'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install ctx-tool
      shell: bash
      working-directory: '${{ inputs.path }}'
      env:
        CTX_VERSION_SPEC: ${{ inputs.version }}
      run: |
        if [ -f pyproject.toml ] && grep -q 'name = "ctx-tool"' pyproject.toml; then
          python -m pip install -e "."
        else
          python -m pip install "ctx-tool${CTX_VERSION_SPEC}"
        fi

    - name: Run deterministic ctx verification gate
      shell: bash
      working-directory: '${{ inputs.path }}'
      run: |
        if [ ! -f .ctx/metadata.json ]; then
          CTX_OUTPUT=json python -m ctx refresh .
        fi
        CTX_OUTPUT=json python -m ctx check . --verify --check-exit
