name: Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify module entry point
        run: python -m ctx --version

      - name: Verify documentation hygiene
        run: python -m unittest tests/test_doc_hygiene.py -v

      - name: Run test suite
        run: python -m pytest tests

      - name: Verify deterministic .ctx/ init, check, capsule, and impact
        run: |
          CTX_OUTPUT=json python -m ctx init .
          CTX_OUTPUT=json python -m ctx check . --verify --check-exit
          CTX_OUTPUT=json python -m ctx export . --capsule --out-file .tmp/capsule.json
          CTX_OUTPUT=json python -m ctx impact src/ctx/skeleton.py .
          CTX_OUTPUT=json python -m ctx uninit .
