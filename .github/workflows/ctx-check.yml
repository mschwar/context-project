name: CTX Structural Check

on:
  workflow_dispatch:

jobs:
  check_ctx_maps:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ctx
        run: python -m pip install -e ".[dev]"

      - name: Initialize and verify deterministic .ctx/ maps
        run: |
          python -m ctx init .
          python -m ctx check . --verify --check-exit
          python -m ctx uninit .
        env:
          CTX_OUTPUT: json
